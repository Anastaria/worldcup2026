name = "worldcup2026-score-cron"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 每 4 小时运行一次（UTC，整点：0/4/8/12/16/20 点）
[triggers]
crons = ["0 */4 * * *"]

# 绑定与前端 Pages 项目同一个 D1 数据库（worldcup2026）
# database_id 在 Cloudflare 控制台 D1 数据库详情页可见，填进来即可
[[d1_databases]]
binding = "DB"
database_name = "worldcup2026"
database_id = "在此填入你的 D1 database id"

# 数据源：footballdata（推荐，稳定）或 baidu（尽力而为）
# 不填则：有 FOOTBALL_DATA_TOKEN 时用 footballdata，否则用 baidu
[vars]
SOURCE = "footballdata"

# 敏感变量请用命令行 secret 设置（不要写在这里）：
#   npx wrangler secret put FOOTBALL_DATA_TOKEN   # footballdata 源的 API token
#   npx wrangler secret put RUN_KEY               # 可选：手动触发 /run 的口令
