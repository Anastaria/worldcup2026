<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f44" />
  <title>2026世界杯，燃情一夏</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 进入图：轮播三句足球语录（每句 2 秒，淡入淡出） -->
  <div id="splash" class="splash">
    <div class="splash-bg"></div>
    <div class="splash-mask"></div>
    <div class="splash-content">
      <h1 class="splash-title">2026世界杯</h1>
      <p class="splash-slogan">燃情一夏</p>
      <div class="splash-stage" id="splashStage">
        <figure class="quote-slide">
          <span class="quote-mark">“</span>
          <blockquote>足球就是如此，一方的欢喜衬托着另一方的忧伤，人类的极端情感，在这一刻得到充分的体现和释放，这就是足球。</blockquote>
          <figcaption>—— “足球诗人”解说员 贺炜</figcaption>
        </figure>
        <figure class="quote-slide">
          <span class="quote-mark">“</span>
          <blockquote>当人们问及我哪一个进球是最精彩、漂亮的，我的回答总是：下一个！</blockquote>
          <figcaption>—— 贝利（巴西）</figcaption>
        </figure>
        <figure class="quote-slide">
          <span class="quote-mark">“</span>
          <blockquote>人生就像罚点球，你永远也不会知道接下来要发生什么。但我们还是要一如既往地努力，纵乌云遮住了太阳，或阳光刺穿了乌云，到达之前永不停止。</blockquote>
          <figcaption>—— 巴乔（意大利）</figcaption>
        </figure>
      </div>
      <div class="splash-dots" id="splashDots"><span class="on"></span><span></span><span></span></div>
      <button class="splash-skip" id="splashSkip">跳过</button>
    </div>
  </div>

  <div id="app">
    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-cup">🏆</span>
          <div class="brand-text">
            <div class="brand-title">2026世界杯，燃情一夏</div>
            <div class="brand-sub" id="headerSub">美加墨 · 6/12-7/20 北京时间</div>
          </div>
        </div>
        <div class="header-user" id="headerUser"></div>
      </div>
    </header>

    <!-- 主内容 -->
    <main id="view" class="view"></main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="schedule"><span class="tab-ico">📅</span><span>赛程</span></button>
      <button class="tab" data-tab="rank"><span class="tab-ico">🏅</span><span>积分榜</span></button>
      <button class="tab" data-tab="follow"><span class="tab-ico">⭐</span><span>关注</span></button>
      <button class="tab" data-tab="bet"><span class="tab-ico">🎯</span><span>竞猜</span></button>
      <button class="tab" data-tab="me"><span class="tab-ico">👤</span><span>我的</span></button>
    </nav>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>

  <!-- 世界杯主题曲（进入即播放） -->
  <audio id="bgm" src="assets/theme.mp3" loop preload="auto"></audio>
  <button id="bgmToggle" class="bgm-toggle" aria-label="背景音乐开关" title="主题曲">
    <span class="bgm-ico">🎵</span>
    <span class="bgm-eq"><i></i><i></i><i></i></span>
  </button>

  <script>
    (function () {
      var bgm = document.getElementById('bgm');
      var btn = document.getElementById('bgmToggle');
      if (!bgm || !btn) return;
      bgm.volume = 0.55;
      var started = false;

      function reflect() {
        var playing = !bgm.paused && !bgm.ended;
        btn.classList.toggle('playing', playing);
      }

      function tryPlay() {
        var p = bgm.play();
        if (p && typeof p.then === 'function') {
          p.then(function () { started = true; reflect(); })
           .catch(function () { /* 被浏览器拦截，等待用户首次交互 */ });
        }
      }

      // 进入即尝试播放（多数浏览器会拦截带声音的自动播放）
      tryPlay();

      // 首次任意交互（含点击“跳过”进入主页）时补播一次
      function onFirstGesture() {
        if (started) return;
        tryPlay();
      }
      ['pointerdown', 'touchstart', 'click', 'keydown'].forEach(function (ev) {
        document.addEventListener(ev, onFirstGesture, { passive: true });
      });

      // 用户主动开关
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (bgm.paused) { started = true; tryPlay(); }
        else { bgm.pause(); }
        reflect();
      });

      bgm.addEventListener('play', reflect);
      bgm.addEventListener('pause', reflect);
      reflect();
    })();
  </script>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var slides = splash.querySelectorAll('.quote-slide');
      var dots = splash.querySelectorAll('#splashDots span');
      var STEP = 2500; // 每句 2.5 秒
      var i = 0, timers = [];
      function show(n) {
        slides.forEach(function (s, k) { s.classList.toggle('on', k === n); });
        dots.forEach(function (d, k) { d.classList.toggle('on', k === n); });
      }
      show(0);
      function dismiss() {
        if (splash.classList.contains('hide')) return;
        timers.forEach(clearTimeout);
        splash.classList.add('hide');
        setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
      }
      // 依次切到第 2、3 句，最后一句展示满 2 秒后退出
      for (var n = 1; n < slides.length; n++) {
        (function (idx) { timers.push(setTimeout(function () { show(idx); }, idx * STEP)); })(n);
      }
      timers.push(setTimeout(dismiss, slides.length * STEP));
      var skip = document.getElementById('splashSkip');
      if (skip) skip.addEventListener('click', dismiss);
    })();
  </script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
