<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1f44" />
  <title>2026世界杯，燃情一夏</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 进入图（5 秒后自动进入） -->
  <div id="splash" class="splash">
    <div class="splash-bg"></div>
    <div class="splash-mask"></div>
    <div class="splash-content">
      <div class="splash-cup">🏆</div>
      <h1 class="splash-title">2026世界杯</h1>
      <p class="splash-slogan">燃情一夏</p>
      <p class="splash-quote" id="splashQuote">当人们问及我哪一个进球最精彩，我的回答总是：下一个！<br/><span>—— 贝利（巴西）</span></p>
      <div class="splash-loading"><span></span><span></span><span></span></div>
      <button class="splash-skip" id="splashSkip">跳过</button>
    </div>
  </div>

  <div id="app">
    <!-- 顶部栏 -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-cup">🏆</span>
          <div class="brand-text">
            <div class="brand-title">2026世界杯，燃情一夏</div>
            <div class="brand-sub" id="headerSub">美加墨 · 6/12-7/20 北京时间</div>
          </div>
        </div>
        <div class="header-user" id="headerUser"></div>
      </div>
    </header>

    <!-- 主内容 -->
    <main id="view" class="view"></main>

    <!-- 底部导航 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="schedule"><span class="tab-ico">📅</span><span>赛程</span></button>
      <button class="tab" data-tab="rank"><span class="tab-ico">🏅</span><span>积分榜</span></button>
      <button class="tab" data-tab="follow"><span class="tab-ico">⭐</span><span>关注</span></button>
      <button class="tab" data-tab="bet"><span class="tab-ico">🎯</span><span>竞猜</span></button>
      <button class="tab" data-tab="me"><span class="tab-ico">👤</span><span>我的</span></button>
    </nav>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var quoteEl = document.getElementById('splashQuote');
      var quotes = [
        '当人们问及我哪一个进球最精彩，我的回答总是：下一个！<br><span>—— 贝利（巴西）</span>',
        '人生就像罚点球，你永远不会知道接下来会发生什么，但我们仍要一如既往地努力。<br><span>—— 巴乔（意大利）</span>',
        '足球就是如此，一方的欢喜衬托着另一方的忧伤，人类的极端情感在这一刻得到充分释放。<br><span>—— 解说员 贺炜</span>'
      ];
      var qi = 0;
      var rotate = setInterval(function () {
        qi = (qi + 1) % quotes.length;
        if (quoteEl) {
          quoteEl.style.opacity = '0';
          setTimeout(function () { quoteEl.innerHTML = quotes[qi]; quoteEl.style.opacity = '1'; }, 280);
        }
      }, 1600);
      function dismiss() {
        if (splash.classList.contains('hide')) return;
        clearInterval(rotate);
        splash.classList.add('hide');
        setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
      }
      var timer = setTimeout(dismiss, 5000);
      var skip = document.getElementById('splashSkip');
      if (skip) skip.addEventListener('click', function () { clearTimeout(timer); dismiss(); });
    })();
  </script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
